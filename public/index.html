<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0d10"><title>Betslip</title>
<style>
:root{--bg:#0b0d10;--card:#12161b;--line:#1f262e;--tx:#eef1f5;--mut:#7d8896;--b:#5aa9ff;--g:#34d399;--r:#fb7185;--o:#fbbf24;--n:#3b4452;color-scheme:dark}
@media(prefers-color-scheme:light){:root{--bg:#f6f7f9;--card:#fff;--line:#e6e9ee;--tx:#14181d;--mut:#6b7684;--b:#2563eb;--g:#059669;--r:#e11d48;--o:#d97706;--n:#c3c9d2;color-scheme:light}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.7 system-ui,Vazirmatn,Tahoma,sans-serif}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-block:10px}
.brand{font-weight:800;letter-spacing:-.02em;font-size:17px}.sp{flex:1}
.sub,small{color:var(--mut);font-size:12px}
button,input,select,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 12px}
button{cursor:pointer;transition:border-color .15s}button:hover{border-color:var(--mut)}
button.pri{background:var(--tx);color:var(--bg);border-color:var(--tx);font-weight:600}
button.x{background:none;border-color:transparent;font-size:12px;padding:3px 10px;color:var(--mut)}button.x:hover{color:var(--tx)}
:focus-visible{outline:2px solid var(--b);outline-offset:2px}
.tabs{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px}
.tabs button{border:0;background:none;color:var(--mut);padding:3px 14px;border-radius:9px}.tabs button.on{background:var(--tx);color:var(--bg)}
#err{display:none;margin-top:12px;padding:9px 14px;border:1px solid var(--o);color:var(--o);border-radius:12px;font-size:13px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;padding-top:12px;color:var(--mut);font-size:12px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-inline-end:6px;background:var(--c,var(--n))}
main{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,400px),1fr));gap:16px;align-items:start;padding:16px 0 80px}
.bet,.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.bet.lost{border-color:color-mix(in srgb,var(--r) 40%,var(--line))}.bet.won{border-color:color-mix(in srgb,var(--g) 40%,var(--line))}
.bh{padding:16px 18px}.t{display:flex;justify-content:space-between;align-items:center;gap:8px}
h2{font-size:16px;margin:0;font-weight:700}h3{font-size:13px;color:var(--mut);margin:0 0 8px;font-weight:600}
.chip{font-size:12px;font-weight:600;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);border-radius:99px;padding:1px 12px;white-space:nowrap}
.kv{display:flex;gap:22px;margin:12px 0 4px}.kv div{display:flex;flex-direction:column}.kv b{font-size:17px;font-variant-numeric:tabular-nums}
.bar{display:flex;height:4px;border-radius:2px;overflow:hidden;background:var(--line);margin:12px 0 8px;gap:2px}.bar span{display:block}
.cnt{display:flex;gap:12px;font-size:12px;color:var(--mut)}
.acts{display:flex;flex-wrap:wrap;gap:2px;margin:10px -8px -8px}
.legs{border-top:1px solid var(--line)}
.leg{display:grid;grid-template-columns:10px 1fr auto;gap:12px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line)}.leg:last-child{border-bottom:0}
.dot{width:9px;height:9px;border-radius:50%;background:var(--c,var(--n));display:block}
.c-b{--c:var(--b)}.c-g{--c:var(--g)}.c-r{--c:var(--r)}.c-o{--c:var(--o)}.c-n{--c:var(--n)}
.dot.live{animation:p 1.4s infinite;box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 25%,transparent)}
@keyframes p{50%{opacity:.4}}@media(prefers-reduced-motion:reduce){.dot.live{animation:none}}
.nm{font-size:14px;font-weight:500;direction:ltr;text-align:right;unicode-bidi:plaintext}.pk{font-size:12px;color:var(--mut)}
.gl{font-size:11px;color:var(--mut);direction:ltr;text-align:right;margin-top:2px}
.sc{text-align:center;min-width:76px;max-width:170px;cursor:pointer;border-radius:8px;padding:2px 6px}.sc b{display:block;font-size:16px;direction:ltr;font-variant-numeric:tabular-nums}
.sc small{display:block;white-space:normal;line-height:1.4}.sc small.v,.v{color:var(--g)}.sc small.w,.w{color:var(--o)}.sc a{font-size:11px;color:var(--b)}
.pub .sc{cursor:default}.pub header .wrap>:not(.brand):not(.sp):not(#upd){display:none}
.kpis{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.k{padding:14px 18px}.k b{display:block;font-size:22px}.card.tb{padding:16px 18px}
.tr{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-top:1px solid var(--line);font-size:13px}.tr span:first-child{flex:1}
.emp{grid-column:1/-1;text-align:center;padding:48px 0}
footer{text-align:center;padding:0 0 40px}
.tool{display:flex;gap:8px;padding-top:12px}
.bulk{position:fixed;inset-inline:0;bottom:0;z-index:6;display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;padding:12px;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.fil{grid-column:1/-1;display:flex;gap:12px;align-items:center;padding:10px 14px;border:1px solid var(--line);border-radius:12px;font-size:13px}.fil a,.sc a{color:var(--b)}
.tl{display:flex;align-items:center}.ck{width:18px;height:18px;accent-color:var(--b);margin-inline-end:8px}
.leg.hl{background:color-mix(in srgb,var(--b) 9%,transparent)}
[data-g],[data-gb]{cursor:pointer}.pub .tool{display:none}
[hidden]{display:none!important}
dialog{background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:18px;width:min(560px,94vw);padding:20px}
dialog::backdrop{background:#0009;backdrop-filter:blur(3px)}dialog form>*{display:block;width:100%;margin-bottom:10px}
.row{display:flex;gap:6px;margin-bottom:8px}.row>*{flex:1;min-width:0}.row>button{flex:none}
.opt{text-align:right;margin:3px 0}
textarea{direction:ltr;font-family:ui-monospace,Menlo,monospace;font-size:12px}
</style>
</head>
<body>
<header><div class="wrap"><span class="brand">Betslip</span>
 <nav class="tabs" id="tabs"><button data-t="act" class="on">فعال</button><button data-t="his">تاریخچه</button><button data-t="risk">ریسک</button><button data-t="st">آمار</button></nav>
 <span class="sp"></span><span class="sub" id="upd">در حال دریافت…</span>
 <button id="rf" title="به‌روزرسانی">↻</button><button id="add" class="pri">+ بلیت</button><button id="exp">JSON</button><button id="out">خروج</button></div></header>
<div class="wrap"><div id="err"></div>
<div class="legend"><span style="--c:var(--b)"><i></i>زنده و مطابق پیش‌بینی</span><span style="--c:var(--g)"><i></i>تمام‌شده و درست</span><span style="--c:var(--r)"><i></i>اشتباه</span><span style="--c:var(--o)"><i></i>زنده و نزدیک</span><span><i></i>شروع نشده</span><span>نتایج بر اساس وقت قانونی (۹۰ دقیقه)</span></div>
<div class="tool" id="tool"><select id="srt"><option value="risk">بیشترین ریسک</option><option value="new">جدیدترین</option><option value="old">قدیمی‌ترین</option><option value="odds">بیشترین ضریب</option><option value="win">بیشترین برد احتمالی</option></select><button id="sel">انتخاب گروهی</button></div>
<main id="app"></main>
<footer id="ver" class="sub" dir="ltr"></footer></div>

<dialog id="lg"><form id="lf"><b id="lt">ورود</b><input id="un" placeholder="نام کاربری (انگلیسی)" autocomplete="username" required><input id="pw" type="password" placeholder="رمز (حداقل ۸ کاراکتر)" autocomplete="current-password" required><input id="iv" placeholder="کد دعوت" hidden><div class="w sub" id="le"></div><button class="pri">ادامه</button><a href="#" id="sw" class="sub">حساب ندارید؟ ثبت‌نام</a></form></dialog>
<dialog id="mp"><form onsubmit="return false"><b id="mt"></b><div class="sub">بازی را از نتایج منابع انتخاب کنید تا برای همهٔ بلیت‌ها یادش بماند.</div><input id="mq" placeholder="جستجوی اسم تیم در منابع"><div id="ml"></div><button type="button" id="mc">بستن</button></form></dialog>
<dialog id="ad"><form onsubmit="return false">
 <b id="adt">افزودن بلیت</b>
 <select id="md"><option value="p">چسباندن متن بلیت (از سایت شرط‌بندی)</option><option value="f">فرم دستی، بازی به بازی</option><option value="m">متنی دستی (هر خط یک بازی)</option></select>
 <input id="nm" placeholder="نام بلیت">
 <div id="mf" hidden class="row"><input id="sk" placeholder="مبلغ (USDT)"><input id="od" placeholder="ضریب کل (خالی = حاصل‌ضرب)"><input id="ch" placeholder="کش‌اوت"></div>
 <div id="ff" hidden>
  <div class="row"><input id="fh" placeholder="تیم میزبان"><input id="fa" placeholder="تیم میهمان"><input id="fo" placeholder="ضریب"></div>
  <div class="row"><select id="fc"></select><input id="fv" placeholder="مقدار"><button type="button" id="fadd">+ شرط</button></div>
  <div class="sub" id="fcur"></div>
  <button type="button" id="fleg">افزودن این بازی به بلیت</button>
  <div class="sub" id="flist"></div>
 </div>
 <textarea id="tx" rows="12"></textarea>
 <div class="sub" id="hint"></div>
 <div class="row"><button type="button" class="pri" id="ok">ثبت بلیت</button><button type="button" id="cl">بستن</button></div>
</form></dialog>
<dialog id="ov"><form onsubmit="return false"><b id="ovt"></b>
 <div class="row"><input id="oh" inputmode="numeric" placeholder="گل میزبان"><input id="oa" inputmode="numeric" placeholder="گل میهمان"><input id="om" inputmode="numeric" placeholder="دقیقه (اختیاری)"></div>
 <select id="os"><option value="live">در حال انجام</option><option value="fin">پایان‌یافته (نتیجهٔ ۹۰ دقیقه)</option></select>
 <select id="ow" hidden><option value="0">برندهٔ نهایی (برای شرط صعود)</option><option value="1">میزبان صعود کرد</option><option value="2">میهمان صعود کرد</option></select>
 <div class="sub w" id="ovh"></div>
 <div class="row"><button type="button" class="pri" id="ovs">ذخیره</button><button type="button" id="ovx">بستن</button></div>
 <div class="row"><button type="button" id="ovc">حذف نتیجهٔ دستی</button><button type="button" id="ovr">بازنشانی نتیجهٔ ذخیره‌شده</button></div>
</form></dialog>
<div class="bulk" id="bulk" hidden></div>

<script>
const BASE=location.pathname.startsWith('/betslip')?'/betslip':'';
const ls={g:k=>{try{return localStorage.getItem(k)}catch(e){return null}},s:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const PUB=new URLSearchParams(location.search).get('s');
const SN={espn:'ESPN',sofa:'Sofascore',fd:'football-data',apif:'API-Football',tsdb:'TheSportsDB'};
let OPEN;try{OPEN=new Set(JSON.parse(ls.g('open')||'[]'))}catch(e){OPEN=new Set()}
let SORT=ls.g('srt')||'risk',FIL=null,SEL=null;
let KEY=ls.g('tok')||'',D={bets:[]},LV=[],SRC=[],tab='act',tmr,dirty=0,at=null,started=0;

// ---------- شبکه ----------
async function api(p,o={}){const r=await fetch(BASE+p,{...o,headers:{'content-type':'application/json',authorization:'Bearer '+KEY}});
 if(r.status==401){const e=new Error('رمز اشتباه است');e.u=1;throw e}if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}
const banner=m=>{const e=$('#err');e.style.display=m?'block':'none';e.textContent=m||''};
const save=()=>{clearTimeout(tmr);tmr=setTimeout(()=>api('/api/data',{method:'PUT',body:JSON.stringify(D)}).then(()=>banner('')).catch(e=>banner('ذخیره نشد: '+e.message)),700)};
async function init(){try{D=await api('/api/data');render();await live();if(!started){started=1;sched()}}
 catch(e){if(e.u){$('#lg').showModal()}else banner('خطا در اتصال به سرور یا دیتابیس: '+e.message)}}
let needMore=0;
const unmatched=()=>D.bets.some(b=>!b.arch&&b.legs.some(l=>!l.fin&&!l.ov&&!LV.some(e=>mt(l,e))));
async function live(){
 if(D.bets.some(b=>!b.arch&&b.legs.some(l=>!l.fin&&!l.ov))){
  try{const j=await(await fetch(BASE+'/api/live'+(needMore?'?apif=1':''))).json();LV=j.events;SRC=j.sources;at=new Date();
   const nm=unmatched();if(nm&&!needMore){needMore=1;return live()}needMore=nm?1:0}
  catch(e){banner('دریافت نتایج زنده ناموفق بود')}}
 render()}

// ---------- تطبیق نام تیم ----------
const fold=s=>s.toLowerCase().replace(/æ/g,'ae').replace(/[øö]/g,'o').replace(/ß/g,'ss').replace(/ł/g,'l').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,' ');
const STOP=new Set('fc afc cf sc ac as fk sk bk if real club the city united cd rc ad us kaa krc rsc'.split(' '));
const AL=[['crvena zvezda','red star'],['inter milan','internazionale'],['athletic bilbao','athletic club'],['olympiacos','olympiakos'],['ofk belgrade','ofk beograd'],['heart of midlothian','hearts'],['prague','praha']];
const TC={};const tk=s=>TC[s]||(TC[s]=(f=>(f+' '+AL.filter(a=>f.includes(a[0])).map(a=>a[1]).join(' ')).split(/\s+/).filter(w=>w.length>2&&!STOP.has(w)))(fold(s)));
const same=(a,b)=>{const x=tk(a),y=tk(b);return x.some(w=>y.some(v=>v==w||(w.length>4&&v.length>4&&w.slice(0,5)==v.slice(0,5))))};

// ---------- ترکیب منابع (رأی‌گیری) ----------
const YB=/\b(u\d{2}|ii|iii|b|w|women|reserves?|youth|juniors?|academy)\b/;
const yb=n=>YB.test(fold(n));
const mt=(l,e)=>l.map?(e.home==l.map.h&&e.away==l.map.a):(same(l.home,e.home)&&same(l.away,e.away)&&yb(e.home)==yb(l.home)&&yb(e.away)==yb(l.away));
const CC=new Map();const cons=l=>{if(!CC.has(l))CC.set(l,cons0(l));return CC.get(l)};
function cons0(l){
 if(l.ov)return{h:l.ov.h,a:l.ov.a,w:l.ov.w,st:l.ov.f?'post':'in',min:l.ov.m||45,man:1,clk:l.ov.f?'پایان (دستی)':'زنده (دستی)'};
 if(l.fin&&l.fin.t&&new Date(l.fin.t)>Date.now()){delete l.fin;dirty=1}
 if(l.fin)return{h:l.fin.h,a:l.fin.a,w:l.fin.w,st:'post',t:l.fin.t&&new Date(l.fin.t),clk:'پایان',fin:1};
 const H0=LV.filter(e=>mt(l,e));if(!H0.length)return null;
 const bs={};H0.forEach(e=>{const d=Math.abs(new Date(e.t)-Date.now())||0;if(!bs[e.s]||d<bs[e.s].d)bs[e.s]={e,d}});
 const H=Object.values(bs).map(v=>v.e),g={};
 H.forEach(e=>(g[e.h+'-'+e.a]=g[e.h+'-'+e.a]||[]).push(e));
 const G=Object.values(g).sort((a,b)=>b.length-a.length||a[0].p-b[0].p),r=G[0][0];
 const fut=r.st=='post'&&r.t&&new Date(r.t)>Date.now()+6e4;
 return{h:r.h,a:r.a,st:fut?'pre':r.st,clk:r.pp?'تعویق/لغو':r.clk,min:r.min,t:r.t&&new Date(r.t),over:r.over,w:r.w,aet:r.aet,pp:r.pp,goals:r.goals,ref:r.home+' – '+r.away,
  src:G.map(g=>[[...new Set(g.map(e=>SN[e.s]||e.s))].join('+'),g[0].h+'-'+g[0].a]),cf:G.length>1}}

// ---------- ارزیابی پیش‌بینی ----------
// کد هر شرط: 1 2 X 1X X2 12 | O2.5 U2.5 HO1.5 AU0.5 | BY BN | T3 | S2-1 | AH1-1.5  ؛ ترکیب با & (مثل 1&O2.5)
function chk(p,h,a){const g=h+a,d=h-a;let m;
 if(p=='1')return[d>0,1-d,0];if(p=='2')return[d<0,1+d,0];if(p=='X')return[d==0,Math.abs(d),0];
 if(p=='1X')return[d>=0,-d,0];if(p=='X2')return[d<=0,d,0];if(p=='12')return[d!=0,d?0:1,0];
 if(p=='BY')return[h>0&&a>0,(h==0)+(a==0),'up'];if(p=='BN')return[!(h>0&&a>0),0,'down'];
 if(m=p.match(/^([HA]?)([OU])([\d.]+)$/)){const v=m[1]=='H'?h:m[1]=='A'?a:g,L=+m[3];return m[2]=='O'?[v>L,Math.floor(L)+1-v,'up']:[v<L,0,'down']}
 if(m=p.match(/^T(\d+)$/)){const N=+m[1];return[g==N,Math.abs(N-g),g>N?'down':0]}
 if(m=p.match(/^S(\d+)-(\d+)$/)){const x=+m[1],y=+m[2];return[h==x&&a==y,Math.max(0,x-h)+Math.max(0,y-a),h>x||a>y?'down':0]}
 if(m=p.match(/^AH([12])([+-][\d.]+)$/)){const e=m[1]=='1'?h+ +m[2]-a:a+ +m[2]-h;return[e>0,Math.floor(-e)+1,0]}
 return[false,9,0]}
function ev1(p,x){const Q=p[0]=='Q',fin=x.st=='post'||(x.over&&!Q);
 const[ok,need,mono]=Q?(x.st=='post'&&x.w?[x.w==(p=='Q1'?1:2),1,0]:chk(p=='Q1'?'1':'2',x.h,x.a)):chk(p,x.h,x.a);
 if(fin)return ok?['g',0]:['r',1];
 if(mono=='up'&&ok)return['g',0];if(mono=='down'&&!ok)return['r',1];
 if(ok)return['b',0];
 return need<=1||need*25<=90-(x.min||0)?['o',0]:['r',0]}
function ev(p,x){
 if(!x||x.st=='pre')return['n',0];
 const R=p.split('&').map(q=>ev1(q,x)),C=R.map(r=>r[0]);
 if(R.some(r=>r[1]))return['r',1];
 if(C.every(c=>c=='g'))return['g',0];
 if(C.every(c=>c=='g'||c=='b'))return['b',0];
 return[C.includes('r')?'r':'o',0]}
const pt1=(p,l)=>{let m;const H=l.home,A=l.away,F={1:'برد '+H,2:'برد '+A,X:'مساوی','1X':H+' یا مساوی',X2:'مساوی یا '+A,12:'بدون مساوی',BY:'هر دو تیم گل می‌زنند',BN:'حداقل یک تیم گل نمی‌زند',Q1:'صعود '+H+' (کل بازی)',Q2:'صعود '+A+' (کل بازی)'};
 if(F[p])return F[p];
 if(m=p.match(/^([HA]?)([OU])([\d.]+)$/))return(m[1]=='H'?'گل‌های '+H+' ':m[1]=='A'?'گل‌های '+A+' ':'مجموع گل ')+(m[2]=='O'?'بالای ':'زیر ')+m[3];
 if(m=p.match(/^T(\d+)$/))return'دقیقاً '+m[1]+' گل';
 if(m=p.match(/^S(\d+)-(\d+)$/))return'نتیجهٔ دقیق '+m[1]+'-'+m[2];
 if(m=p.match(/^AH([12])(.+)$/))return'هندیکپ '+(m[1]==1?H:A)+' ('+m[2]+')';return p};
const pickTxt=(p,l)=>p.split('&').map(q=>pt1(q,l)).join(' + ');
const fmtT=t=>t&&!isNaN(t)?t.toLocaleString('fa-IR',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}):'زمان نامشخص';
const COL={g:'var(--g)',b:'var(--b)',o:'var(--o)',r:'var(--r)',n:'var(--line)'};

// ---------- نمایش ----------
const stt=x=>x.st=='post'?(x.aet?'پایان ۹۰′ (وقت اضافه بود)':'پایان'):x.over?'۹۰′ تمام؛ وقت اضافه':esc(x.clk||'زنده');
const gk=l=>fold(l.home)+'|'+fold(l.away);
function view(b,pub){
 const L=b.legs.map((l,i)=>{const x=cons(l),[c,dead]=ev(l.pick,x);
  if(!pub&&x&&x.st=='post'&&!x.man&&!x.fin&&!l.fin&&!l.ov&&x.t&&x.t<new Date()){l.fin={h:x.h,a:x.a,w:x.w||0,t:x.t.toISOString()};dirty=1}
  return{l,i,x,c,dead}});

let tm;
function delay(){const now=Date.now();
 for(const b of D.bets){if(b.arch)continue;for(const l of b.legs){if(l.fin||l.ov)continue;const x=cons(l);
  if(x&&(x.st=='in'||(x.st=='pre'&&x.t&&x.t-now<20*6e4&&x.t-now>-4*36e5)))return 3e4}}
 return 3e5}
function sched(){clearTimeout(tm);tm=setTimeout(async()=>{if(!document.hidden)await live();sched()},delay())}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&(D.bets.length||PUB)){live();sched()}});
